<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đọc Xưa</title>
<meta name="description" content="Đọc miễn phí tiểu thuyết, truyện và thơ Việt Nam kinh điển.">
<meta http-equiv="Cache-Control" content="no-cache">
<script>
  /* Luôn tải bản mới nhất của CSS/JS/config: gắn mốc thời gian vào đường dẫn
     để trình duyệt không dùng lại bản cũ trong bộ nhớ đệm. */
  window.DX_V = Date.now();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Quicksand:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<script>document.write('<link rel="stylesheet" href="assets/style.css?v=' + window.DX_V + '">');</script>
<noscript><link rel="stylesheet" href="assets/style.css"></noscript>
<script>
  try {
    var s = JSON.parse(localStorage.getItem("dx.settings") || "{}");
    if (s.theme && s.theme !== "auto") document.documentElement.dataset.theme = s.theme;
    if (s.size) document.documentElement.style.setProperty("--read-size", s.size + "px");
    if (s.font === "sans") document.documentElement.dataset.font = "sans";
  } catch (e) {}
</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in wrap">
      <a class="brand" href="#/"><span class="brand-mark">Đ</span><span id="brandName">Đọc Xưa</span></a>
      <nav class="nav" aria-label="Chính">
        <a href="#/" data-nav="home">Khám phá</a>
        <a href="#/browse" data-nav="browse">Thể loại</a>
        <a href="#/library" data-nav="library">Thư viện</a>
      </nav>
      <form class="search" id="searchForm" role="search">
        <label class="sr" for="q">Tìm truyện</label>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm truyện, tác giả…" autocomplete="off">
      </form>
      <button class="iconbtn" id="settingsBtn" aria-label="Cài đặt đọc" aria-expanded="false">Aa</button>
    </div>
  </header>

  <div class="settings" id="settings" hidden>
    <div class="settings-row">
      <span class="lbl">Cỡ chữ</span>
      <div class="seg">
        <button type="button" data-size="-1" aria-label="Chữ nhỏ hơn">A−</button>
        <output id="sizeOut">19</output>
        <button type="button" data-size="1" aria-label="Chữ lớn hơn">A+</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="lbl">Nền</span>
      <div class="seg">
        <button type="button" data-theme="auto">Tự động</button>
        <button type="button" data-theme="light">Sáng</button>
        <button type="button" data-theme="paper">Giấy</button>
        <button type="button" data-theme="dark">Tối</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="lbl">Kiểu chữ</span>
      <div class="seg">
        <button type="button" data-font="serif">Có chân</button>
        <button type="button" data-font="sans">Không chân</button>
      </div>
    </div>
  </div>

  <main id="app" aria-live="polite"></main>

  <footer class="foot wrap">
    <p>Nội dung tác phẩm được tải trực tiếp từ <a href="https://vi.wikisource.org" target="_blank" rel="noopener">Wikisource tiếng Việt</a>, thuộc phạm vi công cộng hoặc giấy phép CC BY-SA. Một số liên kết trên trang là liên kết tiếp thị liên kết.</p>
  </footer>

  <nav class="bottomnav" aria-label="Điều hướng nhanh">
    <a href="#/" data-nav="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Khám phá</a>
    <a href="#/browse" data-nav="browse"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Thể loại</a>
    <a href="#/library" data-nav="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 3 15-3.5 1z"/></svg>Thư viện</a>
  </nav>

  <script>
    document.write('<script src="config.js?v=' + window.DX_V + '"><\/script>');
    document.write('<script src="assets/app.js?v=' + window.DX_V + '"><\/script>');
  </script>
</body>
</html>
